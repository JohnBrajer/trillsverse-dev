# Insert once into the EXISTING trillsverse.com HTTPS server block,
# after inspecting the current reverse-proxy configuration.
# Public reads only. Authenticated publication stays on the loopback relay.
location ^~ /api/trvs-intel/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
}
